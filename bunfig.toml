# Preload is handled by dev.ts for development and build.ts for production.
# Do not add preload here — it gets embedded in compiled binaries.

[test]
preload = ["./tests/setup.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
# Threshold enforcement: bun's coverageThreshold key is not honored in 1.3.13.
# Enforcement lives in scripts/check-coverage.ts, run by `task test`.
